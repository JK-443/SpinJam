# SpinJam TV now-playing dashboard (panel view for Cast).
# Preferred path: spinjam-tv (HA requires a hyphen in dashboard url_path).
# Or call service: spinjam.create_dashboard
#
# Layout: details (art/meta/progress) left, karaoke lyrics right.
#
# Cast service (called by spinjam.start when built-in casting is on):
#   service: cast.show_lovelace_view
#   data:
#     entity_id: media_player.example_tv
#     dashboard_path: spinjam-tv
#     view_path: now

title: SpinJam
views:
  - title: Now
    path: now
    type: panel
    cards:
      - type: horizontal-stack
        cards:
          - type: custom:spinjam-lyrics-card
            entity: media_player.spinjam_now_playing
            mode: details
            offset_entity: number.spinjam_lyric_offset
          - type: custom:spinjam-lyrics-card
            entity: media_player.spinjam_now_playing
            mode: lyrics
            offset_entity: number.spinjam_lyric_offset
  - title: Controls
    path: controls
    type: masonry
    cards:
      - type: tile
        entity: switch.spinjam_cast
        name: Cast
        icon: mdi:cast
      - type: tile
        entity: select.spinjam_display
        name: Display
        icon: mdi:television
      - type: tile
        entity: select.spinjam_source
        name: Source
        icon: mdi:speaker-multiple
      - type: tile
        entity: switch.spinjam_lyrics
        name: Lyrics
        icon: mdi:microphone-variant
      - type: tile
        entity: number.spinjam_lyric_offset
        name: Lyric delay
        icon: mdi:timer-outline
      - type: horizontal-stack
        cards:
          - type: button
            entity: button.spinjam_lyrics_earlier
            name: Lyrics earlier
            icon: mdi:chevron-double-up
            show_name: true
            show_icon: true
          - type: tile
            entity: sensor.spinjam_lyric_delay
            name: Lyric delay
            icon: mdi:timer-outline
          - type: button
            entity: button.spinjam_lyrics_later
            name: Lyrics later
            icon: mdi:chevron-double-down
            show_name: true
            show_icon: true
