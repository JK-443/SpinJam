# SpinJam TV now-playing dashboard (panel view for Cast).
# Preferred path: spinjam-tv (HA requires a hyphen in dashboard url_path).
# Or call service: spinjam.create_dashboard
#
# Cast service (called by spinjam.start when built-in casting is on):
#   service: cast.show_lovelace_view
#   data:
#     entity_id: media_player.example_tv
#     dashboard_path: spinjam-tv
#     view_path: now

title: SpinJam
views:
  - title: Now
    path: now
    type: panel
    cards:
      - type: custom:spinjam-now-playing-card
        entity: media_player.spinjam_now_playing
