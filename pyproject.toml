[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinjam"
version = "0.7.0"
description = "Now-playing for Home Assistant: HA integration + vinyl capture MQTT node"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SpinJam" }]
dependencies = [
  "paho-mqtt>=2.1.0",
  "PyYAML>=6.0.1",
  "shazamio>=0.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
ha = [
  # Pins an older paho-mqtt transitively; install in a dedicated venv for HA tests.
  "pytest-homeassistant-custom-component>=0.13.190",
]

[project.scripts]
spinjam = "spinjam.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spinjam*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]