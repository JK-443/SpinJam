[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinjam"
version = "0.1.0"
description = "Vinyl capture and recognition node that publishes now-playing to Home Assistant over MQTT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SpinJam" }]
dependencies = [
  "paho-mqtt>=2.1.0",
  "PyYAML>=6.0.1",
  "shazamio>=0.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
spinjam = "spinjam.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spinjam*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]