identify:
  name: Identify vinyl
  description: Ask the vinyl capture node to identify the current audio (MQTT).

set_sync_offset:
  name: Set sync offset
  description: Adjust playback position sync offset in milliseconds (also used as the base for lyrics).
  fields:
    offset_ms:
      name: Offset
      description: Milliseconds to add to media position (negative = earlier). Fine-tune lyrics further with lyric_offset_ms (positive = lyrics later).
      required: true
      selector:
        number:
          min: -2000
          max: 2000
          unit_of_measurement: ms

select_album:
  name: Select album
  description: Manually lock/select an album (forwarded to vinyl node when present).
  fields:
    album:
      name: Album
      description: Album name or Discogs/search string.
      required: true
      selector:
        text:

clear_lock:
  name: Clear lock
  description: Clear manual album lock and vinyl now-playing metadata.

start:
  name: Start SpinJam display
  description: >
    Select a configured display (or keep the current select.spinjam_display
    choice), fire spinjam_start, and — when built-in casting is enabled —
    cast the Lovelace view via cast.show_lovelace_view. Same as turning on
    switch.spinjam_cast. Requires a one-time dashboard (see docs/TV_CAST.md).
  fields:
    display:
      name: Display
      description: Optional media_player entity id; must be one of the configured displays.
      required: false
      selector:
        entity:
          domain: media_player

stop:
  name: Stop SpinJam display
  description: >
    End the SpinJam cast session (media_player.turn_off when built-in casting
    is on) and fire spinjam_stop. Same as turning off switch.spinjam_cast.

create_dashboard:
  name: Create SpinJam dashboard
  description: >
    Create or update a storage-mode Lovelace dashboard with a panel view and
    the SpinJam now-playing card (for cast.show_lovelace_view). Dashboard path
    must include a hyphen (default spinjam-tv).
  fields:
    dashboard_path:
      name: Dashboard path
      description: Lovelace url_path (must contain a hyphen).
      required: false
      selector:
        text:
    view_path:
      name: View path
      description: View path inside the dashboard (default now).
      required: false
      selector:
        text:
